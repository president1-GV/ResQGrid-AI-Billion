mandatory_disclaimer: Operational resource inventory is simulated because no authorized
  live resource system is connected.
truth_classes:
  LIVE: Real-time, sub-minute telemetry directly ingested from authorized active sensors
    or public APIs.
  NEAR_REAL_TIME: Satellite-derived observation with standard processing latency (e.g.
    1 to 3 hours for MODIS/VIIRS).
  PUBLIC: Authoritative open-access research repositories (Zenodo, USGS, NOAA, IIT
    Delhi, CRED).
  HISTORICAL: Multi-decadal historical disaster inventories used for training and
    vulnerability baselines.
  SYNTHETIC: Simulated operational resource inventories, vehicle fleets, and benchmark
    stress-test scenarios.
  SIMULATION: Physics-based numerical solver outputs (e.g. hydro-dynamic flood extents,
    tsunami surge wavefronts).
  MANUAL: Field incident report manually keyed in by incident officers or verified
    from citizen dispatch.
  AUTHORIZED: Official cryptographic sign-off or validated government order from State
    Disaster Command.
